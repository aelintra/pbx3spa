# Deploy pbx3spa to GitHub Pages (custom domain app.pbx3.com).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install and build
        env:
          VITE_INSTANCE_DIRECTORY_URL: ${{ vars.VITE_INSTANCE_DIRECTORY_URL }}
          VITE_FLEET_GATEKEEPER_URL: ${{ vars.VITE_FLEET_GATEKEEPER_URL }}
          VITE_LINE_TEST_WSS_URL: ${{ vars.VITE_LINE_TEST_WSS_URL }}
        run: |
          export VITE_INSTANCE_DIRECTORY_URL="${VITE_INSTANCE_DIRECTORY_URL:-https://08jzwn-pbx3.s3.us-east-1.amazonaws.com/catalog/instance-index.json}"
          export VITE_FLEET_GATEKEEPER_URL="${VITE_FLEET_GATEKEEPER_URL:-https://control.pbx3.com}"
          export VITE_LINE_TEST_WSS_URL="${VITE_LINE_TEST_WSS_URL:-wss://sbc.pbx3.com:8089/ws}"
          npm ci
          npm run build
          # SPA history fallback on GitHub Pages
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
